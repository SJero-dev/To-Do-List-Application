<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Application</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>My To-Do List</h1>

    <!-- A. Add Tasks: input field + "Add Task" button -->
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Enter a task..." autocomplete="on" />
      <button id="addBtn">Add Task</button>
    </div>

    <!-- E. Validation message (shown when the input is empty) -->
    <p id="errorMsg" class="error hidden">Please enter a task before adding.</p>

    <!-- Bonus: task counter + clear all -->
    <div class="toolbar">
      <span id="taskCounter">Total tasks: 0</span>
      <button id="clearBtn" class="clear-btn">Clear All</button>
    </div>

    <!-- B. Display Tasks: tasks are added here dynamically -->
    <ul id="taskList"></ul>

    <!-- Bonus: message when there are no tasks -->
    <p id="emptyMsg" class="empty">No tasks yet. Add one above!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
